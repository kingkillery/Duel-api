name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[all,dev]"

    - name: Run pytest suite
      env:
        PYTHONPATH: .
      run: |
        pytest

  smoke:
    # Proves the shipped install actually works: entry points resolve and the
    # offline engine runs with zero network. Catches packaging breakage
    # before users do.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Entry points and offline engine
      run: |
        duel-api --help
        duel-api demo --sessions 200
        duel-api doctor

  fresh-install:
    # Proves the PUBLIC install route works from a clean runner: installs
    # duel-api from the Pages simple index with no checkout code on the
    # import path, then runs the offline entry points. This is the exact
    # command the launch posts tell users to run — CI runs it first.
    # Note: tracks the latest RELEASED version, not the checkout.
    runs-on: ubuntu-latest
    steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install from public Pages index (no cache, no checkout)
      run: |
        python -m pip install --upgrade pip
        pip install --index-url https://kingkillery.github.io/Duel-api/simple/ --no-cache-dir duel-api

    - name: Doctor and offline demo from the shipped wheel
      run: |
        duel-api --help
        duel-api doctor
        duel-api demo --sessions 200

  gitleaks:
    # Session tokens, cookies, and account ids must never reach the repo.
    # Scans the FULL history (not just the pushed range) with this project's
    # custom rules, so a credential that slipped in earlier cannot hide.
    # Pinned version + checksum: the scanner itself is supply-chain checked.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install gitleaks (pinned + checksum verified)
      env:
        GL_VERSION: "8.30.1"
      run: |
        base="https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}"
        archive="gitleaks_${GL_VERSION}_linux_x64.tar.gz"
        curl -sSfL -o "${archive}" "${base}/${archive}"
        curl -sSfL -o gl.sums "${base}/gitleaks_${GL_VERSION}_checksums.txt"
        grep "${archive}" gl.sums > verify.txt
        sha256sum -c verify.txt
        tar -xzf "${archive}" gitleaks
        ./gitleaks version

    - name: Scan full history
      run: |
        ./gitleaks detect --source . --log-opts="--all" \
          --config .gitleaks.toml --redact --no-banner
