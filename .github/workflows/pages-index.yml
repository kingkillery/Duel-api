# Deploy a real PEP 503 simple index on GitHub Pages (text/html MIME).
# Users then install with one line:
#   pip install --extra-index-url https://kingkillery.github.io/Duel-api/simple/ duel-api
#
# Wheels live under /dist/ on the same Pages site (relative links). HF remains
# a secondary mirror; this is the public one-click path.

name: Pages index

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag matches pyproject version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG pyproject=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "Tag v$TAG does not match pyproject version $VER" >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
          pip install --upgrade build huggingface_hub

      - name: Full test suite
        env:
          PYTHONPATH: .
        run: pytest

      - name: Smoke — installed entry points work offline
        run: |
          pip install -e .
          duel-api --help
          duel-api demo --sessions 200
          duel-api doctor

      - name: Build distributions
        run: python -m build

      - name: Assemble Pages site
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ secrets.HF_REPO }}
          HF_REPO_TYPE: ${{ secrets.HF_REPO_TYPE }}
          HF_PREFIX: ${{ secrets.HF_PREFIX }}
        run: python tools/assemble_pages_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
