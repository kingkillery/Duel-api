# Publish release artifacts to a Hugging Face repo ("bucket") folder.
#
# Why HF instead of R2/PyPI: the maintainer already has a bucket there, so
# there is no new account, no new server, and nothing touches the home
# network — GitHub CI uploads with a scoped token, users download from HF.
# Users install with pip's --find-links against a static index page:
#   pip install --find-links \
#     https://huggingface.co/datasets/<user>/<bucket>/resolve/main/<prefix>/simple/duel-api/index.html \
#     duel-api
#
# ISOLATION CONTRACT (the guarantee): every path this workflow writes is
# asserted to start with <prefix>/ (default: duel-api-index). Uploads are
# additive only — individual upload_file calls, never sync --delete, never
# touching anything outside the prefix. Existing bucket content, settings,
# and other folders are read never, written never. The .whl/.tar.gz/.html
# files are inert to the dataset viewer. Visible footprint, stated openly:
# one folder plus additive commit history in the bucket repo.
#
# One-time setup (maintainer):
#   1. Pick the bucket repo, e.g. <user>/<bucket> (dataset or model).
#   2. Hugging Face → Settings → Access Tokens → create a FINE-GRAINED
#      token scoped to ONLY that repo with Write permission. (Classic
#      `write` tokens also work but grant more than needed.)
#   3. GitHub repo → Settings → Secrets and variables → Actions → add:
#        HF_TOKEN ....... the token from step 2 (never paste it in chat/logs)
#        HF_REPO ........ e.g. <user>/<bucket>
#        HF_REPO_TYPE ... dataset (default) or model
#        HF_PREFIX ...... duel-api-index (default; single folder scope)
#      Or locally: gh secret set HF_TOKEN --repo kingkillery/Duel-api
#   4. Push a v* tag. The workflow runs the full suite + smoke, uploads the
#      new sdist/wheel under <prefix>/dist/, and regenerates
#      <prefix>/simple/duel-api/index.html from the full remote listing
#      (old versions stay installable).

name: Hosted index

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-test-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches pyproject version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG pyproject=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "Tag v$TAG does not match pyproject version $VER" >&2
            exit 1
          fi

      - name: Check HF secrets present
        run: |
          for s in HF_TOKEN HF_REPO; do
            if [ -z "${!s}" ]; then
              echo "Missing secret $s — see docs/hosted-downloads.md" >&2
              exit 1
            fi
          done
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ secrets.HF_REPO }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Full test suite
        env:
          PYTHONPATH: .
        run: pytest

      - name: Smoke — installed entry points work offline
        run: |
          pip install -e .
          duel-api --help
          duel-api demo --sessions 200
          duel-api doctor

      - name: Build distributions
        run: |
          python -m pip install --upgrade build huggingface_hub
          python -m build

      - name: Upload to bucket and rebuild index
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ secrets.HF_REPO }}
          HF_REPO_TYPE: ${{ secrets.HF_REPO_TYPE }}
          HF_PREFIX: ${{ secrets.HF_PREFIX }}
        run: |
          python - <<'EOF'
          import glob
          import os
          import subprocess

          from huggingface_hub import HfApi

          repo_id = os.environ["HF_REPO"]
          repo_type = os.environ.get("HF_REPO_TYPE") or "dataset"
          prefix = os.environ.get("HF_PREFIX") or "duel-api-index"
          assert prefix and "/" not in prefix.strip("/"), f"bad prefix {prefix!r}"
          prefix = prefix.strip("/")

          def scoped(path):
              assert path.startswith(prefix + "/"), f"refusing out-of-scope path {path!r}"
              return path

          api = HfApi()
          dist_paths = sorted(glob.glob("dist/*"))
          assert dist_paths, "nothing built"
          for local in dist_paths:
              name = os.path.basename(local)
              assert name.endswith((".whl", ".tar.gz", ".zip")), f"refusing {name!r}"
              api.upload_file(
                  path_or_fileobj=local,
                  path_in_repo=scoped(f"{prefix}/dist/{name}"),
                  repo_id=repo_id,
                  repo_type=repo_type,
              )
              print("uploaded", name)

          remote = api.list_repo_files(repo_id=repo_id, repo_type=repo_type)
          listing = "\n".join(
              f.rsplit("/", 1)[-1] for f in remote if f.startswith(prefix + "/dist/")
          )
          index = subprocess.run(
              ["python", "tools/build_simple_index.py", "duel-api"],
              input=listing,
              capture_output=True,
              text=True,
              check=True,
          ).stdout
          with open("/tmp/index.html", "w", encoding="utf-8") as fh:
              fh.write(index)
          api.upload_file(
              path_or_fileobj="/tmp/index.html",
              path_in_repo=scoped(f"{prefix}/simple/duel-api/index.html"),
              repo_id=repo_id,
              repo_type=repo_type,
          )
          print("index rebuilt over", len(listing.split()), "remote files")
          EOF
