# Publish duel-api to PyPI via Trusted Publishing (no stored tokens).
#
# One-time setup (maintainer, ~5 minutes):
#   1. Create the project on PyPI (name: duel-api) — or let this workflow's
#      first run fail with "project not found" and then create it.
#   2. PyPI project Settings → Publishing → "Add a new pending publisher":
#        PyPI project name ... duel-api
#        Owner ................ kingkillery
#        Repository name ...... Duel-api
#        Workflow name ........ publish.yml
#        Environment name ..... release   (prod) / test-release (TestPyPI)
#   3. Create the matching GitHub environments (`release`, `test-release`).
#      Environment protection rules (required reviewers) are recommended
#      for `release`.
#
# After that: tagging vX.Y.Z runs tests + smoke, builds, and uploads.
# Version in pyproject.toml must match the tag (CI checks this).

name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Where to upload"
        required: true
        default: "testpypi"
        type: choice
        options: [testpypi, pypi]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches pyproject version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG pyproject=$VER"
          if [ "${{ github.event_name }}" = "push" ] && [ "$TAG" != "$VER" ]; then
            echo "Tag v$TAG does not match pyproject version $VER" >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Full test suite
        env:
          PYTHONPATH: .
        run: pytest

      - name: Smoke — installed entry points work offline
        run: |
          pip install -e .
          duel-api --help
          duel-api demo --sessions 200
          duel-api doctor

      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build-and-check
    if: github.event_name == 'push' || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    needs: build-and-check
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: test-release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
